name: Windows quality and packaging

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/privacy-scan.cjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run test:e2e
      - run: npm run pack:win
      - uses: actions/upload-artifact@v4
        with:
          name: SlipFlow-Windows-${{ github.sha }}
          path: |
            release/SlipFlow-Setup-*.exe
            release/SlipFlow-Setup-*.exe.blockmap
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SlipFlow-QA-${{ github.sha }}
          path: |
            docs/screenshots/*.png
            temp/evidence/*.pdf
            temp/playwright-results/**
          if-no-files-found: ignore
